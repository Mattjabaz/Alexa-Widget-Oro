<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fonelli Gold Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --marino:#0A1A2F;
  --marino-claro:#12293F;
  --linea:#1E3A56;
  --tiffany:#81D8D0;
  --tiffany-hondo:#2E8B86;
  --blanco:#FFFFFF;
  --tenue:#8AA4BC;
  --num:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --gra:'Bodoni Moda',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--marino);color:var(--blanco);
  font-family:var(--num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
body{display:flex;flex-direction:column;padding:2.2vh 2.6vw;user-select:none;cursor:none}

/* ── cabecera ── */
.cab{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:1em}
.marca{display:flex;align-items:center;gap:.75em}
.marca img{height:clamp(30px,6vh,54px);width:auto;display:block}
.titulo{font-family:var(--gra);font-size:clamp(14px,2.7vh,28px);letter-spacing:.19em;
  text-transform:uppercase;line-height:1.1}
.titulo em{font-style:italic;color:var(--tiffany)}
.estado{display:flex;align-items:center;gap:.6em;font-size:clamp(10px,1.7vh,16px);
  letter-spacing:.16em;text-transform:uppercase;color:var(--tenue)}
.foco{width:.55em;height:.55em;border-radius:50%;background:var(--tiffany);
  animation:latir 4s ease-out infinite}
.foco.frio{background:var(--tenue);animation:none}
@keyframes latir{0%{box-shadow:0 0 0 0 rgba(129,216,208,.45)}70%,100%{box-shadow:0 0 0 .55em rgba(129,216,208,0)}}
.regla{flex:0 0 auto;height:1px;margin-top:1.4vh;
  background:linear-gradient(90deg,var(--tiffany),var(--linea) 50%,transparent)}

/* ── mercado ── */
.mercado{flex:0 0 auto;display:grid;grid-template-columns:1.3fr 1fr;gap:2.6vw;padding:2.2vh 0 2.4vh}
.rotulo{font-size:clamp(9px,1.65vh,15px);letter-spacing:.22em;text-transform:uppercase;
  color:var(--tenue);margin-bottom:.4em}
.mercado .cifra{font-size:clamp(34px,8.6vh,76px);font-weight:500;line-height:.92;letter-spacing:-.025em}
.sig{color:var(--tiffany);opacity:.72;font-size:.5em;vertical-align:.32em;margin-right:.1em}
.pie{display:flex;align-items:baseline;gap:.8em;margin-top:.5em;
  font-size:clamp(10px,1.8vh,17px);color:var(--tenue)}
.delta{font-weight:700}
.delta.up{color:var(--tiffany)} .delta.dn{color:var(--blanco);opacity:.7}

/* ── quilates ── */
.esp{flex-shrink:0}
.esp.arriba{flex:1 0 0}
.esp.abajo{flex:3 0 0}
.leyes{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vw}
.ley{position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:31vh;
  background:var(--marino-claro);border:1px solid var(--linea);border-radius:5px;
  padding:2vh 1.6vw;overflow:hidden}
.ley::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(158deg,rgba(129,216,208,.10),transparent 46%)}
.motivo{position:absolute;right:-2%;bottom:-8%;width:52%;opacity:.14;pointer-events:none}
.motivo svg{width:100%;height:auto;display:block}
.punzon{position:absolute;top:1.7vh;left:1.4vw;font-family:var(--gra);font-weight:500;
  font-size:clamp(16px,3.3vh,34px);letter-spacing:.09em;line-height:1;color:var(--tiffany);
  border:2px solid var(--tiffany);border-radius:2.2em;padding:.34em .8em .42em}
.dato{position:relative;text-align:center}
.ley .cifra{font-size:clamp(34px,9.2vh,82px);font-weight:700;line-height:.92;letter-spacing:-.035em}
.ley .sig{font-size:.46em;vertical-align:.42em;margin-right:.08em}
.ley .unidad{font-size:clamp(9px,1.6vh,15px);letter-spacing:.2em;text-transform:uppercase;
  color:var(--tenue);margin-top:.55em}
.destello{animation:destellar 1.2s ease-out}
@keyframes destellar{0%{color:var(--tiffany);text-shadow:0 0 24px rgba(129,216,208,.40)}100%{}}

/* ── zócalo ── */
.zocalo{flex:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:1em;
  margin-top:0;padding-top:1.4vh;border-top:1px solid var(--linea);
  font-size:clamp(9px,1.65vh,15px);letter-spacing:.14em;text-transform:uppercase;color:var(--tenue)}
.zocalo .der{text-align:right}
.zocalo .med{text-align:center;color:var(--tenue)}
.zocalo .med b{color:var(--tiffany);font-weight:500;letter-spacing:.06em}

/* ── portada ── */
#portada{position:fixed;inset:0;z-index:9;background:var(--marino);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em}
#portada img{height:clamp(64px,16vh,130px);width:auto}
#portada .lema{font-family:var(--gra);font-size:clamp(18px,4vh,38px);letter-spacing:.2em;
  text-transform:uppercase;color:var(--blanco)}
#portada .lema em{font-style:italic;color:var(--tiffany)}
#portada .instr{font-size:clamp(11px,1.9vh,18px);letter-spacing:.2em;text-transform:uppercase;color:var(--tenue)}
#portada.ido{display:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-aspect-ratio:1/1){
  .mercado{grid-template-columns:1fr;gap:1.8vh}
  .leyes{grid-template-columns:1fr;gap:1vh}
  .ley{flex-direction:row;align-items:center;justify-content:space-between;min-height:0}
  .punzon{position:static;font-size:clamp(15px,2.8vh,28px)}
  .dato{text-align:right}
  .ley .unidad{display:none}
  .motivo{width:26%}
  .esp{display:none}
  .zocalo{grid-template-columns:1fr;text-align:center;gap:.3em}
  .zocalo .der{text-align:center}
}
</style>
</head>

  { nombre:'goldprice.dev', url:'https://goldprice.dev/v1/prices?symbol=XAU-USD-SPOT',
    leer: j => +(j.price ?? j.data?.price ?? j.prices?.[0]?.price) },
  { nombre:'xaus',          url:'https://xaus.com/api/v1/price',
    leer: j => +(j.price ?? j.price_usd ?? j.gold?.price) }
];
const FUENTES_FX = [
  { nombre:'er-api',      url:'https://open.er-api.com/v6/latest/USD', leer: j => +j.rates.MXN },
  { nombre:'frankfurter', url:'https://api.frankfurter.app/latest?from=USD&to=MXN', leer: j => +j.rates.MXN }
];

const $ = id => document.getElementById(id);
const mx = (n, d = 2) => n.toLocaleString('es-MX', {minimumFractionDigits:d, maximumFractionDigits:d});
let base = null;

async function probar(fuentes){
  for (const f of fuentes){
    try{
      const r = await fetch(f.url, {cache:'no-store'});
      if (!r.ok) continue;
      const n = f.leer(await r.json());
      if (Number.isFinite(n) && n > 0) return {n, nombre:f.nombre};
    }catch(e){}
  }
  return null;
}

function pintar(id, txt){
  const el = $(id);
  if (el.textContent === txt) return;
  el.textContent = txt;
  el.classList.remove('destello'); void el.offsetWidth; el.classList.add('destello');
}

async function actualizar(){
  const [oro, fx] = await Promise.all([probar(FUENTES_ORO), probar(FUENTES_FX)]);

  if (!oro || !fx){
    $('foco').classList.add('frio');
    $('sello').textContent = 'sin señal';
    return;
  }
  $('foco').classList.remove('frio');

  const onza = oro.n, tc = fx.n;
  const g24 = (onza / CFG.ozTroyGramos) * tc;

  pintar('xau', onza.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}));
  pintar('fx',  mx(tc, 4));
  pintar('g24', mx(g24 * CFG.ley.k24));
  pintar('g14', mx(g24 * CFG.ley.k14));
  pintar('g10', mx(g24 * CFG.ley.k10));

  if (base === null) base = onza;
  const d = ((onza - base) / base) * 100;
  const el = $('delta');
  el.className = 'delta ' + (d >= 0 ? 'up' : 'dn');
  el.textContent = (d >= 0 ? '▲ ' : '▼ ') + Math.abs(d).toFixed(2) + '%';

  $('sello').textContent = oro.nombre;
  $('ultima').textContent = new Date().toLocaleTimeString('es-MX',
      {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
}

/* reloj y fecha corren aparte, cada segundo */
function tictac(){
  const h = new Date();
  $('reloj').textContent = h.toLocaleTimeString('es-MX',
      {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
  $('fecha').textContent = h.toLocaleDateString('es-MX',
      {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}

/* ══ Ancla: Silk cierra la página salvo que haya audio en curso ══ */
function anclar(){
  const sr = 8000, n = sr;
  const buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const txt = (o,s) => [...s].forEach((c,i) => v.setUint8(o+i, c.charCodeAt(0)));
  txt(0,'RIFF'); v.setUint32(4,36+n,true); txt(8,'WAVEfmt '); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true);
  v.setUint32(28,sr,true); v.setUint16(32,1,true); v.setUint16(34,8,true);
  txt(36,'data'); v.setUint32(40,n,true);
  for (let i=0;i<n;i++) v.setUint8(44+i,128);

  const a = new Audio(URL.createObjectURL(new Blob([buf],{type:'audio/wav'})));
  a.loop = true; a.volume = 0.001;
  a.play().catch(()=>{});
  setInterval(()=>{ if (a.paused) a.play().catch(()=>{}); }, 20000);

  if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{});
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{});
  });
}

$('portada').addEventListener('click', () => {
  $('portada').classList.add('ido');
  anclar();
});

tictac(); setInterval(tictac, 1000);
actualizar(); setInterval(actualizar, CFG.refrescoMs);
</script>
