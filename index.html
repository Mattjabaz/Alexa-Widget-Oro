<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fonelli Gold Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --marino:#0A1A2F; --marino-claro:#12293F; --linea:#1E3A56;
  --tiffany:#81D8D0; --blanco:#FFFFFF; --tenue:#8AA4BC;
  --verde:#3ED598; --rojo:#F26D5B;
  --num:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --gra:'Bodoni Moda',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--marino);color:var(--blanco);
  font-family:var(--num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
body{display:flex;flex-direction:column;padding:2vh 2.4vw;user-select:none}

.cab{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:1em}
.marca{display:flex;align-items:center;gap:.7em}
.marca img{height:clamp(26px,5.2vh,46px);width:auto;display:block}
.titulo{font-family:var(--gra);font-size:clamp(12px,2.4vh,25px);letter-spacing:.19em;text-transform:uppercase;line-height:1.1}
.titulo em{font-style:italic;color:var(--tiffany)}
.saludo{font-size:clamp(8px,1.45vh,13px);letter-spacing:.18em;text-transform:uppercase;
  color:var(--tenue);margin-top:.35em}
.estado{display:flex;align-items:center;gap:.55em;font-size:clamp(9px,1.5vh,14px);
  letter-spacing:.16em;text-transform:uppercase;color:var(--tenue)}
.foco{width:.55em;height:.55em;border-radius:50%;background:var(--tiffany);animation:latir 4s ease-out infinite}
.foco.frio{background:var(--rojo);animation:none}
@keyframes latir{0%{box-shadow:0 0 0 0 rgba(129,216,208,.45)}70%,100%{box-shadow:0 0 0 .55em rgba(129,216,208,0)}}
.regla{flex:0 0 auto;height:1px;margin-top:1.1vh;background:linear-gradient(90deg,var(--tiffany),var(--linea) 50%,transparent)}

.mercado{flex:0 0 auto;display:grid;grid-template-columns:1.3fr 1fr;gap:2.4vw;padding:2.1vh 0 2.3vh}
.rotulo{font-size:clamp(8px,1.5vh,14px);letter-spacing:.22em;text-transform:uppercase;color:var(--tenue);margin-bottom:.35em}
.mercado .cifra{font-size:clamp(28px,7vh,62px);font-weight:500;line-height:.92;letter-spacing:-.025em}
.sig{color:var(--tiffany);opacity:.72;font-size:.5em;vertical-align:.32em;margin-right:.1em}
.pie{display:flex;align-items:baseline;gap:.7em;margin-top:.45em;font-size:clamp(9px,1.6vh,15px);color:var(--tenue)}
.delta{font-weight:700}
.delta.up{color:var(--verde)} .delta.dn{color:var(--rojo)}

.leyes{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1.5vw}
.ley{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:24vh;padding:7.2vh 1.4vw 2vh;
  background:var(--marino-claro);border:1px solid var(--linea);border-radius:5px;overflow:hidden}
.ley::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(158deg,rgba(129,216,208,.10),transparent 46%)}
.motivo{position:absolute;right:-2%;bottom:-8%;width:48%;opacity:.13;pointer-events:none}
.motivo svg{width:100%;height:auto;display:block}
.punzon{position:absolute;top:1.6vh;left:1.2vw;font-family:var(--gra);font-weight:500;
  font-size:clamp(12px,2.5vh,26px);letter-spacing:.09em;line-height:1;color:var(--tiffany);
  border:1.5px solid var(--tiffany);border-radius:2.2em;padding:.3em .74em .38em}
.dato{position:relative;text-align:center}
.ley .cifra{font-size:clamp(28px,7.8vh,68px);font-weight:700;line-height:.92;letter-spacing:-.035em}
.ley .sig{font-size:.46em;vertical-align:.42em;margin-right:.08em}
.ley .unidad{font-size:clamp(8px,1.4vh,13px);letter-spacing:.2em;text-transform:uppercase;color:var(--tenue);margin-top:.5em}
.destello{animation:destellar 1s ease-out}
@keyframes destellar{0%{color:var(--tiffany)}100%{}}

.grafica{flex:1 1 auto;display:flex;flex-direction:column;min-height:15vh;padding-top:1.8vh}
.gcab{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:1em;margin-bottom:.6vh}
.gizq{display:flex;align-items:baseline;gap:.8em}
.gtit{font-size:clamp(8px,1.5vh,13px);letter-spacing:.22em;text-transform:uppercase;color:var(--tenue)}
.gvar{font-size:clamp(10px,1.75vh,16px);font-weight:700}
.gvar.up{color:var(--verde)} .gvar.dn{color:var(--rojo)}
.rangos{display:flex;gap:.3em}
.rangos button{font-family:var(--num);font-size:clamp(8px,1.45vh,13px);font-weight:500;letter-spacing:.1em;
  color:var(--tenue);background:transparent;border:1px solid var(--linea);border-radius:2em;
  padding:.34em .8em;cursor:pointer}
.rangos button.on{color:var(--marino);background:var(--tiffany);border-color:var(--tiffany)}
.lienzo{flex:1 1 auto;position:relative;min-height:0;touch-action:none}
.lienzo svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.gnota{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
  font-size:clamp(8px,1.45vh,13px);letter-spacing:.16em;text-transform:uppercase;color:var(--tenue)}
.globo{position:absolute;pointer-events:none;z-index:3;transform:translate(-50%,-118%);
  background:var(--marino);border:1px solid var(--tiffany);border-radius:4px;padding:.4em .7em;
  white-space:nowrap;opacity:0;transition:opacity .12s}
.globo.ver{opacity:1}
.globo .gf{display:block;font-size:clamp(8px,1.4vh,12px);letter-spacing:.12em;text-transform:uppercase;color:var(--tenue)}
.globo .gp{display:block;font-size:clamp(12px,1.9vh,17px);font-weight:700;color:var(--blanco);margin-top:.15em}

.zocalo{flex:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:1em;
  margin-top:1.1vh;padding-top:1.1vh;border-top:1px solid var(--linea);
  font-size:clamp(8px,1.5vh,13px);letter-spacing:.14em;text-transform:uppercase;color:var(--tenue)}
.zocalo .der{text-align:right} .zocalo .med{text-align:center}
.zocalo .med b{color:var(--tiffany);font-weight:500;letter-spacing:.06em}

#portada{position:fixed;inset:0;z-index:9;background:var(--marino);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em}
#portada img{height:clamp(58px,14vh,120px);width:auto}
#portada .lema{font-family:var(--gra);font-size:clamp(16px,3.6vh,34px);letter-spacing:.2em;text-transform:uppercase}
#portada .lema em{font-style:italic;color:var(--tiffany)}
#portada .instr{font-size:clamp(10px,1.7vh,16px);letter-spacing:.2em;text-transform:uppercase;color:var(--tenue)}
#portada.ido{display:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-aspect-ratio:1/1){
  .mercado{grid-template-columns:1fr;gap:1.5vh;padding:1.6vh 0}
  .leyes{grid-template-columns:1fr;gap:.9vh}
  .ley{flex-direction:row;align-items:center;justify-content:space-between;min-height:0;padding:1.4vh 3vw}
  .punzon{position:static;font-size:clamp(13px,2.5vh,24px)}
  .dato{text-align:right} .ley .unidad{display:none} .motivo{width:22%}
  .grafica{min-height:20vh}
  .zocalo{grid-template-columns:1fr;text-align:center;gap:.25em}
  .zocalo .der{text-align:center}
}
</style>
</head>

     Queda visible para cualquiera que abra el código de la página. */
  clave: 'ga_live_EmKrkD5osIhcnQxYir_o7ocAUYy0EmEXVqFUCdpb',

  /* Cadencia del oro con mercado activo. 25 s consume ~75% de la cuota
     mensual de 100,000 llamadas. No lo bajes de 20 s o te quedas sin
     servicio antes de fin de mes. */
  oroMsBase: 25000,
  fxMs: 45000,
  histMs: 21600000,
  ozTroyGramos: 31.1034768,
  ley: { k24: 1.0, k14: 0.585, k10: 0.417 }
};

const API_ORO = (CFG.proxy || 'https://api.goldprice.dev').replace(/\/+$/,'');
const VIA_PROXY = !!CFG.proxy;
/* La cabecera Authorization dispara un sondeo OPTIONS que muchos
   servidores no contestan, y el navegador corta con "Failed to fetch".
   Probamos primero las variantes por parámetro, que no lo disparan. */
const VARIANTES = [
  { id:'api_key',  arma:u=>{const x=new URL(u); x.searchParams.set('api_key',CFG.clave); return [x,{}];} },
  { id:'key',      arma:u=>{const x=new URL(u); x.searchParams.set('key',CFG.clave);     return [x,{}];} },
  { id:'token',    arma:u=>{const x=new URL(u); x.searchParams.set('token',CFG.clave);   return [x,{}];} },
  { id:'bearer',   arma:u=>[new URL(u), {Authorization:'Bearer '+CFG.clave}] },
  { id:'x-api-key',arma:u=>[new URL(u), {'X-API-Key':CFG.clave}] },
  { id:'anónimo',  arma:u=>[new URL(u), {}] }
];
let AUTH = null;

async function detectarAuth(){
  if (VIA_PROXY){ AUTH = {id:'proxy', arma:u=>[new URL(u),{}]}; return AUTH; }
  const prueba = API_ORO + '/v1/spot/XAU-USD-SPOT?include=stats';
  let respaldo = null;
  for (const v of VARIANTES){
    if (v.id !== 'anónimo' && !CFG.clave) continue;
    try{
      const [u,h] = v.arma(prueba);
      const r = await fetch(u,{headers:h, cache:'no-store'});
      if (!r.ok){ ULTIMO_ERROR.set('auth:'+v.id,'HTTP '+r.status); continue; }
      const j = await r.json();
      if (!Number.isFinite(+j.price)) continue;
      /* open_price solo llega si la llave fue aceptada de verdad */
      if (Number.isFinite(+j.open_price)){ AUTH = v; return v; }
      if (!respaldo) respaldo = v;
    }catch(e){ ULTIMO_ERROR.set('auth:'+v.id, String(e.message||e).slice(0,30)); }
  }
  AUTH = respaldo;
  return AUTH;
}

function pedir(url, extras = {}){
  const base = new URL(url);
  for (const [k,v] of Object.entries(extras)) base.searchParams.set(k,v);
  if (!AUTH) return fetch(base,{cache:'no-store'});
  const [u,h] = AUTH.arma(base.toString());
  return fetch(u,{headers:h, cache:'no-store'});
}
const autoriza = () => (AUTH && AUTH.id==='bearer') ? {Authorization:'Bearer '+CFG.clave} : {};

/* Con llave, el spot sale de la MISMA serie que la gráfica y el ancla:
   XAU-USD-SPOT. Sin llave cae a fuentes gratuitas, que cotizan futuros
   de CME y no cuadran con el histórico. */
const FUENTES_ORO = [
  /* /v1/spot devuelve la fila plana; include=stats agrega apertura,
     máximo, mínimo, cierre previo y el % del día ya calculado. */
  { nombre:'goldprice', minMs:20000, auth:true, gp:true,
    url: API_ORO + '/v1/spot/XAU-USD-SPOT?include=stats',
    leer: j => ({ n:+j.price, abre:+j.open_price, chp:+j.chp, prev:+j.prev_close_price }) },
  { nombre:'gold-api', minMs:15000, url:'https://api.gold-api.com/price/XAU', leer: j => +j.price },
  { nombre:'xaus', minMs:30000, url:'https://xaus.com/api/v1/price',
    leer: j => +(j.spot_usd_oz ?? j.xau?.price ?? j.price) }
];
const FUENTES_FX = [
  { nombre:'interbancario', minMs:45000,
    url:'https://api.exchangerate.dev/v1/latest/USD?symbols=MXN',
    leer: j => +(j.rates?.MXN ?? j.data?.rates?.MXN ?? j.quotes?.USDMXN) },
  { nombre:'er-api', minMs:3600000, url:'https://open.er-api.com/v6/latest/USD', leer: j => +j.rates.MXN },
  { nombre:'frankfurter', minMs:3600000, url:'https://api.frankfurter.app/latest?from=USD&to=MXN', leer: j => +j.rates.MXN }

/* Cada rango pide su propio intervalo de barra.
   1D usa barras de 15 min: misma serie spot que el resto, no otra fuente. */
const RANGOS = [
  { id:'1D', dias:1,    intervalo:'15m', paso:{h:3},  fmt:'hora' },
  { id:'1S', dias:7,    intervalo:'1h',  paso:{d:1},  fmt:'dia'  },
  { id:'1M', dias:30,   intervalo:'1d',  paso:{d:5},  fmt:'dia'  },
  { id:'6M', dias:182,  intervalo:'1d',  paso:{d:15}, fmt:'dia',    pro:true },
  { id:'1A', dias:365,  intervalo:'1d',  paso:{M:1},  fmt:'mes',    pro:true },
  { id:'3A', dias:1095, intervalo:'1d',  paso:{M:6},  fmt:'mesaño', pro:true },
  { id:'5A', dias:1825, intervalo:'1d',  paso:{M:12}, fmt:'anio',   pro:true }
];

const $ = id => document.getElementById(id);
const mx = (n,d=2) => n.toLocaleString('es-MX',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd = n => n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

/* ─── Gobernador de cuota ───
   Reparte lo que queda del mes entre el tiempo que queda del mes.
   Si vas holgado respeta oroMsBase; si vas rápido, estira solo.
   Sin memoria disponible cae a 30 s, que cabe siempre. */
const CUOTA = { mes: 100000, reserva: 8000 };
const LLAVE_MEM = 'fgl_cuota';

function consumo(){
  try{
    const h = new Date(), etq = h.getUTCFullYear()+'-'+h.getUTCMonth();
    let d = JSON.parse(localStorage.getItem(LLAVE_MEM) || 'null');
    if (!d || d.mes !== etq) d = {mes: etq, n: 0};
    return d;
  }catch(e){ return null; }
}
function sumar(n = 1){
  const d = consumo(); if (!d) return;
  d.n += n;
  try{ localStorage.setItem(LLAVE_MEM, JSON.stringify(d)); }catch(e){}
}
function ritmoPermitido(){
  const d = consumo();
  if (!d) return 30000;
  const h = new Date();
  const finMes = Date.UTC(h.getUTCFullYear(), h.getUTCMonth()+1, 1);
  const quedanMs = Math.max(finMes - Date.now(), 60000);
  const quedanLlamadas = (CUOTA.mes - CUOTA.reserva) - d.n;
  if (quedanLlamadas <= 0) return 900000;
  return Math.max(CFG.oroMsBase, Math.round(quedanMs / quedanLlamadas));
}
function usadoPct(){
  const d = consumo();
  return d ? Math.round(d.n / CUOTA.mes * 100) : null;
}

let tcActual = null;
let ancla = null;            // {p, tipo:'apertura'|'cierre'}
let barras = new Map();      // idRango -> [{t,p}]
let rango = '1M';

/* ───────── red con freno ───────── */
const RELOJ = new Map();
const ULTIMO_ERROR = new Map();
const marca = f => { if(!RELOJ.has(f.url)) RELOJ.set(f.url,{libre:0,fallos:0,castigo:0}); return RELOJ.get(f.url); };

async function probar(fuentes){
  for (const f of fuentes){
    const m = marca(f);
    if (Date.now() < m.libre) continue;
    try{
      const r = f.gp ? await pedir(f.url) : await fetch(f.url,{cache:'no-store'});
      if (!r.ok) ULTIMO_ERROR.set(f.url, 'HTTP '+r.status);
      if (r.status===429 || r.status===403){
        m.castigo = Math.min((m.castigo||150000)*2, 3600000);
        m.libre = Date.now()+m.castigo; continue;
      }
      if (!r.ok) throw new Error(r.status);
      const v = f.leer(await r.json());
      const n = (v && typeof v==='object') ? v.n : v;
      if (!Number.isFinite(n) || n<=0) throw new Error('dato');
      m.fallos=0; m.castigo=0; m.libre=Date.now()+f.minMs;
      if (f.auth) sumar();
      ULTIMO_ERROR.delete(f.url);
      return {n, nombre:f.nombre, extra:(v&&typeof v==='object')?v:null};
    }catch(e){
      ULTIMO_ERROR.set(f.url, String(e.message||e).slice(0,40) || 'red/CORS');
      m.fallos++; m.libre = Date.now()+Math.min(60000*2**(m.fallos-1),900000);
    }
  }
  return null;
}

function pintar(id,txt){
  const el=$(id); if(el.textContent===txt) return;
  el.textContent=txt; el.classList.remove('destello'); void el.offsetWidth; el.classList.add('destello');
}

/* ───────── barras diarias ─────────
   Devuelve [{t,p}] con el cierre de cada día. La barra en formación
   (is_closed:false) también sirve: es la sesión de hoy. */
async function traerBarras(idRango){
  if (barras.has(idRango)) return barras.get(idRango);
  const r = RANGOS.find(x=>x.id===idRango);
  const desde = new Date(Date.now() - r.dias*86400000);
  const iso = d => d.toISOString().slice(0,19)+'Z';
  let cursor, salida=[], paginas=0, fallo=null;

  for (const ruta of ['/v1/bars','/v1/prices/history']){
    salida=[]; cursor=undefined; paginas=0;
    try{
      do{
        const u = new URL(API_ORO + ruta);
        u.search = new URLSearchParams({symbol:'XAU-USD-SPOT', interval:r.intervalo,
          from:iso(desde), to:iso(new Date()), limit:'5000', ...(cursor?{cursor}:{})}).toString();
        const resp = await pedir(u.toString());
        sumar();
        if (!resp.ok){ fallo='HTTP '+resp.status; break; }
        const j = await resp.json();
        const filas = j.bars || j.series || [];
        for (const b of filas){
          const t = Date.parse(b.bar_start || b.date), p = parseFloat(b.close);
          if (Number.isFinite(t) && p>0) salida.push({t,p});
        }
        cursor = j.next_cursor;
      } while (cursor && ++paginas < 20);
      if (salida.length){ fallo=null; break; }
    }catch(e){ fallo = String(e.message||e).slice(0,40) || 'red/CORS'; }
  }
  salida.sort((a,b)=>a.t-b.t);
  barras.set(idRango, salida);
  if (fallo) ULTIMO_ERROR.set('bars', fallo);
  else ULTIMO_ERROR.delete('bars');
  return salida;
}

/* El ancla ya no se calcula: la API la reporta.
   open_price es la apertura de la sesión en curso (open_time = medianoche UTC). */
/* Si goldprice no es alcanzable desde el navegador, el ancla sale de
   aurumrates, que publica cierre previo del mismo mercado de futuros
   que gold-api: los dos números quedan consistentes entre sí. */
async function anclaRespaldo(){
  if (ancla) return;
  try{
    const r = await fetch('https://aurumrates.com/api/v1/spot?metals=gold',{cache:'no-store'});
    if (!r.ok) return;
    const g = (await r.json())?.data?.gold;
    if (g && +g.prev_close > 0) ancla = {p:+g.prev_close, tipo:'cierre previo'};
  }catch(e){}
}

function anclarDesde(extra){
  if (!extra) return;
  if (Number.isFinite(extra.abre) && extra.abre > 0){ ancla = {p:extra.abre, tipo:'apertura'}; return; }
  if (Number.isFinite(extra.prev) && extra.prev > 0){ ancla = {p:extra.prev, tipo:'cierre previo'}; }
}

/* ───────── precios ───────── */
let ultimaOnza=null, quietas=0, intervaloOro=CFG.oroMsBase, temporizador=null;

async function refrescarOro(){
  if (document.hidden){ programarOro(); return; }
  const oro = await probar(FUENTES_ORO);
  if (!oro){ $('foco').classList.add('frio'); $('sello').textContent='sin señal'; programarOro(); return; }
  $('foco').classList.remove('frio');
  const pct = usadoPct();
  const via = (oro.nombre==='goldprice' && AUTH) ? '·'+AUTH.id : '';
  $('sello').textContent = oro.nombre + via + (pct !== null && CFG.clave ? ' · ' + pct + '%' : '');

  const onza = oro.n;
  anclarDesde(oro.extra);
  pintar('xau', usd(onza));
  if (tcActual){
    const g24 = (onza/CFG.ozTroyGramos)*tcActual;
    pintar('g24', mx(g24*CFG.ley.k24));
    pintar('g14', mx(g24*CFG.ley.k14));
    pintar('g10', mx(g24*CFG.ley.k10));
  }

  const el = $('delta');
  if (ancla && ancla.p>0){
    const d = ((onza-ancla.p)/ancla.p)*100;
    el.className = 'delta ' + (d>=0?'up':'dn');
    el.textContent = (d>=0?'▲ ':'▼ ') + Math.abs(d).toFixed(2) + '%';
    $('anclaTxt').textContent = 'vs ' + ancla.tipo;
  } else {
    el.className='delta'; el.textContent='—'; $('anclaTxt').textContent='sin ancla';
  }

  const ahora = new Date();

  $('ultima').textContent = ahora.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});

  quietas = (onza===ultimaOnza) ? quietas+1 : 0;
  ultimaOnza = onza;
  const escalera = quietas>=12 ? 300000 : quietas>=4 ? 60000 : CFG.oroMsBase;
  intervaloOro = Math.max(escalera, ritmoPermitido());
  programarOro();
}
function programarOro(){ clearTimeout(temporizador); temporizador=setTimeout(refrescarOro,intervaloOro); }

async function refrescarFx(){
  if (document.hidden) return;
  const fx = await probar(FUENTES_FX);
  if (!fx) return;
  tcActual = fx.n;
  pintar('fx', mx(tcActual,4));
  $('fxsello').textContent = fx.nombre==='interbancario' ? '· interbancario' : '· referencia diaria';
}

/* ───────── ejes ───────── */
function pasoBonito(rangoV, objetivo){
  const bruto = rangoV/objetivo;
  const mag = 10**Math.floor(Math.log10(bruto));
  const n = bruto/mag;
  return (n<=1?1:n<=2?2:n<=5?5:10)*mag;
}
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function rotularX(t, fmt){
  const d = new Date(t);
  if (fmt==='hora')   return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if (fmt==='dia')    return d.getDate()+' '+MES[d.getMonth()];
  if (fmt==='mes')    return MES[d.getMonth()];
  if (fmt==='mesaño') return MES[d.getMonth()]+" '"+String(d.getFullYear()).slice(2);
  return String(d.getFullYear());
}
function marcasX(t0,t1,paso){
  const out=[];
  if (paso.M){
    const d=new Date(t0); d.setDate(1); d.setHours(0,0,0,0);
    while (d.getTime()<t1){ if(d.getTime()>=t0) out.push(d.getTime()); d.setMonth(d.getMonth()+paso.M); }
  } else {
    const ms = paso.h ? paso.h*3600000 : paso.d*86400000;
    const ini = Math.ceil(t0/ms)*ms;
    for (let t=ini; t<=t1; t+=ms) out.push(t);
  }
  return out;
}

/* ───────── dibujo ───────── */
let ultimo = null;

function serie(){
  return (barras.get(rango) || []).slice();
}

function nota(txt){
  $('lienzo').querySelectorAll('svg').forEach(n=>n.remove());
  let g = $('lienzo').querySelector('.gnota');
  if (!g){ g=document.createElement('span'); g.className='gnota'; $('lienzo').prepend(g); }
  g.textContent = txt; g.style.display='';
  $('gvar').textContent=''; ultimo=null;
}

function dibujar(){
  const box = $('lienzo');
  const W = box.clientWidth, H = box.clientHeight;
  if (W<40 || H<40) return;
  const s = serie();
  const cfgR = RANGOS.find(x=>x.id===rango);

  /* Nunca inventar una línea: menos de 3 puntos es "no hay dato". */
  if (s.length < 3){
    const err = ULTIMO_ERROR.get('bars');
    nota(err ? 'histórico no disponible · ' + err : 'sin datos para este periodo');
    return;
  }
  const g = box.querySelector('.gnota'); if (g) g.style.display='none';

  const M = {i: Math.min(58, W*0.07), d: 8, a: 10, b: 20};
  const iw = W-M.i-M.d, ih = H-M.a-M.b;

  const ps = s.map(d=>d.p);
  const pmin = Math.min(...ps), pmax = Math.max(...ps);
  const span = (pmax-pmin) || pmax*0.005;
  const paso = pasoBonito(span*1.3, 3);
  const lo = Math.floor((pmin-span*0.15)/paso)*paso;
  const hi = Math.ceil((pmax+span*0.15)/paso)*paso;

  const t0=s[0].t, t1=s[s.length-1].t, dt=(t1-t0)||1;
  const X = t => M.i + ((t-t0)/dt)*iw;
  const Y = p => M.a + ih - ((p-lo)/(hi-lo))*ih;

  const cambio = ((s[s.length-1].p - s[0].p)/s[0].p)*100;
  const sube = cambio>=0, tinte = sube?'#3ED598':'#F26D5B';

  /* cuadrícula + eje Y */
  let rejilla='', etiqY='';
  for (let p=lo; p<=hi+1e-9; p+=paso){
    const y = Y(p).toFixed(1);
    rejilla += `<line x1="${M.i}" y1="${y}" x2="${W-M.d}" y2="${y}" stroke="#81D8D0" stroke-opacity=".09" stroke-width="1"/>`;
    etiqY   += `<text x="${M.i-7}" y="${y}" text-anchor="end" dominant-baseline="middle"
                 fill="#8AA4BC" font-size="10" font-family="Space Grotesk,sans-serif">${Math.round(p).toLocaleString('en-US')}</text>`;
  }
  /* cuadrícula + eje X */
  let etiqX='';
  for (const t of marcasX(t0,t1,cfgR.paso)){
    const x = X(t).toFixed(1);
    rejilla += `<line x1="${x}" y1="${M.a}" x2="${x}" y2="${M.a+ih}" stroke="#81D8D0" stroke-opacity=".07" stroke-width="1"/>`;
    etiqX   += `<text x="${x}" y="${H-6}" text-anchor="middle"
                 fill="#8AA4BC" font-size="10" font-family="Space Grotesk,sans-serif">${rotularX(t,cfgR.fmt)}</text>`;
  }

  let linea='';
  const puntos = s.map((d,i)=>{
    const x=X(d.t), y=Y(d.p);
    linea += (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';
    return {x,y,t:d.t,p:d.p};
  });
  const base = M.a+ih;
  const area = `M${puntos[0].x.toFixed(1)} ${base} L`+linea.slice(1)+`L${puntos[puntos.length-1].x.toFixed(1)} ${base} Z`;
  const fin = puntos[puntos.length-1];

  box.querySelectorAll('svg').forEach(n=>n.remove());
  box.insertAdjacentHTML('afterbegin',
    `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="lav" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${tinte}" stop-opacity=".26"/>
        <stop offset="100%" stop-color="${tinte}" stop-opacity="0"/></linearGradient></defs>
      ${rejilla}
      <path d="${area}" fill="url(#lav)"/>
      <path d="${linea.trim()}" fill="none" stroke="${tinte}" stroke-width="2.2"
            stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <circle cx="${fin.x.toFixed(1)}" cy="${fin.y.toFixed(1)}" r="3.5" fill="${tinte}"/>
      <line id="guia" x1="0" y1="${M.a}" x2="0" y2="${base}" stroke="${tinte}" stroke-opacity=".45"
            stroke-width="1" style="display:none"/>
      <circle id="tocado" r="4.5" fill="${tinte}" style="display:none"/>
      ${etiqY}${etiqX}
    </svg>`);

  ultimo = {puntos, fmt:cfgR.fmt};
  const gv=$('gvar'); gv.className='gvar '+(sube?'up':'dn');
  gv.textContent = (sube?'▲ ':'▼ ')+Math.abs(cambio).toFixed(1)+'% en '+rango;
}

/* ───────── toque sobre la gráfica ───────── */
function tocar(e){
  if (!ultimo) return;
  const box=$('lienzo'), r=box.getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  let mejor=ultimo.puntos[0];
  for (const p of ultimo.puntos) if (Math.abs(p.x-x)<Math.abs(mejor.x-x)) mejor=p;
  const svg=box.querySelector('svg'); if(!svg) return;
  const guia=svg.querySelector('#guia'), pt=svg.querySelector('#tocado');
  guia.setAttribute('x1',mejor.x); guia.setAttribute('x2',mejor.x); guia.style.display='';
  pt.setAttribute('cx',mejor.x); pt.setAttribute('cy',mejor.y); pt.style.display='';
  const gl=$('globo');
  gl.querySelector('.gf').textContent = ultimo.fmt==='hora'
    ? new Date(mejor.t).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false})
    : new Date(mejor.t).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});
  gl.querySelector('.gp').textContent = '$'+usd(mejor.p);
  gl.style.left = Math.max(60, Math.min(box.clientWidth-60, mejor.x))+'px';
  gl.style.top  = mejor.y+'px';
  gl.classList.add('ver');
  clearTimeout(tocar.reloj);
  tocar.reloj = setTimeout(soltar, 4000);
}
function soltar(){
  $('globo').classList.remove('ver');
  const svg=$('lienzo').querySelector('svg'); if(!svg) return;
  const g=svg.querySelector('#guia'), p=svg.querySelector('#tocado');
  if(g) g.style.display='none'; if(p) p.style.display='none';
}
$('lienzo').addEventListener('pointerdown', tocar);
$('lienzo').addEventListener('pointermove', e => { if(e.buttons||e.pointerType==='touch') tocar(e); });
$('lienzo').addEventListener('pointerup', () => setTimeout(soltar,2500));

/* ───────── botones ───────── */
function montarRangos(){
  const cont=$('rangos'); cont.innerHTML='';
  for (const r of RANGOS){
    if (r.pro && !CFG.clave) continue;
    const b=document.createElement('button');
    b.dataset.r=r.id; b.textContent=r.id;
    if (r.id===rango) b.classList.add('on');
    cont.appendChild(b);
  }
}
$('rangos').addEventListener('click', async e => {
  const b=e.target.closest('button'); if(!b) return;
  rango=b.dataset.r;
  [...$('rangos').children].forEach(x=>x.classList.toggle('on',x===b));
  const r=RANGOS.find(x=>x.id===rango);
  nota('cargando…');
  await traerBarras(rango);
  dibujar();
});

if (window.ResizeObserver) new ResizeObserver(()=>dibujar()).observe($('lienzo'));
window.addEventListener('resize', dibujar);

/* ───────── reloj ───────── */
function tictac(){
  const h=new Date();
  $('reloj').textContent = h.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  $('fecha').textContent = h.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

/* ── ancla: Silk cierra la página salvo que haya audio en curso ── */
function anclarPantalla(){
  const sr=8000,n=sr, buf=new ArrayBuffer(44+n), v=new DataView(buf);
  const txt=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  txt(0,'RIFF'); v.setUint32(4,36+n,true); txt(8,'WAVEfmt '); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true);
  v.setUint32(28,sr,true); v.setUint16(32,1,true); v.setUint16(34,8,true);
  txt(36,'data'); v.setUint32(40,n,true);
  for(let i=0;i<n;i++) v.setUint8(44+i,128);
  const a=new Audio(URL.createObjectURL(new Blob([buf],{type:'audio/wav'})));
  a.loop=true; a.volume=0.001; a.play().catch(()=>{});
  setInterval(()=>{ if(a.paused) a.play().catch(()=>{}); },20000);
  if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{});
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden && navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{});
  });
}
$('portada').addEventListener('click',()=>{ $('portada').classList.add('ido'); anclarPantalla(); dibujar(); });

/* ───────── arranque ───────── */
async function arrancar(){
  montarRangos();
  tictac(); setInterval(tictac,1000);
  await detectarAuth();
  refrescarFx(); setInterval(refrescarFx,CFG.fxMs);
  await refrescarOro();
  await anclaRespaldo(); setInterval(()=>{ if(!ancla) anclaRespaldo(); }, 3600000);
  await traerBarras(rango);
  dibujar();
  setInterval(async ()=>{ barras.clear(); await traerBarras(rango); dibujar(); }, CFG.histMs);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refrescarOro(); });
}
arrancar();
</script>
